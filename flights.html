<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flights to Saudi Arabia (example)</title>
<style>
body{margin:0;background:#0f1419;color:#e6edf3;font-family:system-ui,sans-serif;padding:20px}
h1{font-size:20px;margin:0 0 4px}
.meta{color:#8b98a5;font-size:13px;margin-bottom:14px}
.tabs button{background:#151c24;color:#e6edf3;border:1px solid #2a3440;border-radius:999px;padding:5px 12px;margin:0 6px 6px 0;cursor:pointer}
.tabs button.on{background:#7c4dff;border-color:#7c4dff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid #2a3440}
.pill{padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.ok{background:rgba(61,220,132,.15);color:#3ddc84}
.warn{background:rgba(255,190,60,.15);color:#ffbe3c}
.unv{color:#8b98a5;font-size:12px}
</style>
</head>
<body>
<h1>Flights to Saudi Arabia</h1>
<div class="meta" id="meta">Loading…</div>
<div class="tabs" id="tabs"></div>
<table>
<thead><tr><th>Airline</th><th>From</th><th>To</th><th>Status</th><th>Date</th><th>Source</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<script>
let all = [];
let current = 'all';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function draw() {
  const list = current === 'all' ? all : all.filter(f => f.country === current);
  document.getElementById('rows').innerHTML = list.map(f => `
    <tr>
      <td><b>${esc(f.airline)}</b>${f.verified ? '' : ' <span class="unv">(unverified)</span>'}</td>
      <td>${esc(f.from)}</td>
      <td>${esc(f.to)}</td>
      <td><span class="pill ${esc(f.level)}">${esc(f.status)}</span></td>
      <td>${esc(f.date)}</td>
      <td><a href="${esc(f.source)}" target="_blank" rel="noopener">Source ↗</a></td>
    </tr>`).join('');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.c === current));
}

function buildTabs(countries) {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = ['all', ...countries].map(c =>
    `<button data-c="${esc(c)}">${c === 'all' ? 'All' : esc(c)}</button>`).join('');
  tabs.onclick = e => { if (e.target.dataset.c) { current = e.target.dataset.c; draw(); } };
}

fetch('flights.json')
  .then(r => r.json())
  .then(d => {
    all = d.flights;
    document.getElementById('meta').textContent = 'Last checked ' + new Date(d.checked_at).toLocaleString('en-GB');
    buildTabs([...new Set(all.map(f => f.country))]);
    draw();
  })
  .catch(() => {
    document.getElementById('meta').textContent = 'Could not load flights.json. Open this page through the site, not as a local file.';
  });
</script>
</body>
</html>
